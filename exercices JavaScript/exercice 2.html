
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Exercice 2 JavaScript</title>
</head>

<body>
    <h1>Exercice 2 - Fonctions</h1>

    <script>
        function carre(n) {
            return n * n;
        }

        function bonjour(nom) {
            return `Bonjour ${nom} !`;
        }

        console.log(carre(5));
        console.log(bonjour("Alice"));
    </script>
</body>

</html>
