    <!-- Exercice 2 -->
     <script>
        function carre(n) {
            return n*n;
        };
        const carre_fleche = (n) => n*n;

        function bonjour(nom){
            return "Bonjour " + nom
        }
        const bonjour_fleche = (nom) => "Bonjour "+ nom;
        console.log("-------Exercice 1---------");
        console.log("Fonction carré normale : " + carre(4));
        console.log("Fonction bonjour normale : " + bonjour("Alexandre"))
        

        console.log("-------Exercice 2---------");
        console.log("Fonction carré fléché : " + carre_fleche(4)) 
        console.log("Fonction bonjour fléché : " + bonjour_fleche("Alexandre")) 
     </script>
</body>
